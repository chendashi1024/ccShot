idth="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V4h7l2 3h9v13H3z"/></g><text x="289" y="198" font-size="14" fill="#615f57" font-weight="600" >我的笔记</text><rect x="249" y="220" width="154" height="34" rx="7" fill="#e4e1da" stroke="none" /><text x="267" y="242" font-size="13" fill="#44483e" font-weight="500" >工作手记</text><text x="267" y="282" font-size="13" fill="#7e8076" font-weight="400" >阅读摘录</text><text x="267" y="322" font-size="13" fill="#7e8076" font-weight="400" >周末计划</text><text x="690" y="140" font-size="12" fill="#7b7d74" font-weight="500" text-anchor="middle">工作手记</text><g transform="translate(452,202) scale(1)"><rect x="0" y="0" width="680" height="420" rx="0" fill="#fffdf9" stroke="none" /><text x="36" y="34" font-size="12" fill="#94897e" font-weight="400" >工作手记  /  本周</text><text x="36" y="84" font-size="28" fill="#34352f" font-weight="600" >把想法，留在眼前。</text><text x="36" y="124" font-size="17" fill="#565a53" font-weight="400" >把重要的决定留下来，</text><text x="36" y="153" font-size="17" fill="#565a53" font-weight="400" >然后继续做手头的事。</text><line x1="36" y1="179" x2="642" y2="179" stroke="#e9e4dc" stroke-width="1" /><text x="36" y="216" font-size="15" fill="#3e4740" font-weight="600" >这一周，做好三件事</text><rect x="36" y="238" width="14" height="14" rx="3" fill="#fffdf9" stroke="#b3b8ac" /><text x="62" y="251" font-size="15" fill="#565d55" font-weight="400" >把讨论里的结论整理成一页。</text><rect x="36" y="279" width="14" height="14" rx="3" fill="#fffdf9" stroke="#b3b8ac" /><text x="62" y="292" font-size="15" fill="#565d55" font-weight="400" >把关键步骤截图，标出需要改的地方。</text><rect x="36" y="320" width="14" height="14" rx="3" fill="#fffdf9" stroke="#b3b8ac" /><text x="62" y="333" font-size="15" fill="#565d55" font-weight="400" >留出一个下午，完成最想做的小项目。</text><text x="36" y="391" font-size="13" fill="#94988d" font-weight="400" >周末去走走。让脑袋也透一口气。</text><g transform="translate(476,48)"><rect width="166" height="105" rx="10" fill="#ede7d9"/><circle cx="125" cy="28" r="14" fill="#d3a370"