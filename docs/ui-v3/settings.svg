op stop-color="#dbe6ee"/><stop offset=".48" stop-color="#a1afbf"/><stop offset="1" stop-color="#747e97"/></linearGradient><linearGradient id="settings-bg7" x2="1" y2="1"><stop stop-color="#f4cee0"/><stop offset=".48" stop-color="#ce89ad"/><stop offset="1" stop-color="#ac658b"/></linearGradient></defs><rect x="0" y="0" width="1440" height="900" rx="0" fill="#dce1d9" stroke="none" /><path d="M0 740Q430 190 960 290T1440 570V900H0Z" fill="#cbd5cd"/><path d="M0 830Q750 360 1440 700V900H0Z" fill="#bdcbbf"/><rect x="0" y="0" width="1440" height="32" rx="0" fill="#eef2eb" stroke="none" /><text x="24" y="22" font-size="15" fill="#282d2a" font-weight="400" >●</text><text x="57" y="22" font-size="13" fill="#282d2a" font-weight="600" >备忘录</text><text x="128" y="22" font-size="13" fill="#292c32" font-weight="400" >文件</text><text x="178" y="22" font-size="13" fill="#292c32" font-weight="400" >编辑</text><text x="228" y="22" font-size="13" fill="#292c32" font-weight="400" >显示</text><text x="1245" y="22" font-size="12" fill="#282d2a" font-weight="400" >周二  11月3日  11:03</text><rect x="176" y="101" width="1088" height="582" rx="12" fill="#fafbf8" stroke="#cbd1c9" filter="url(#settings-shadow)"/><circle cx="200" cy="122" r="5.7" fill="#ff6058" stroke="#00000012" /><circle cx="220" cy="122" r="5.7" fill="#febd2e" stroke="#00000012" /><circle cx="240" cy="122" r="5.7" fill="#29c840" stroke="#00000012" /><line x1="176" y1="143" x2="1264" y2="143" stroke="#dce0d7" stroke-width="1" /><text x="720" y="126" font-size="12" fill="#626c65" font-weight="500" text-anchor="middle">工作手记</text><rect x="177" y="144" width="166" height="538" rx="0" fill="#eeefe8" stroke="none" /><text x="205" y="185" font-size="14" fill="#626c65" font-weight="500" >我的笔记</text><rect x="190" y="204" width="140" height="34" rx="6" fill="#e0e5d9" stroke="none" /><text x="207" y="227" font-size="13" fill="#282d2a" font-weight="400" >工作手记</text><text x="207" y="269" font-size="13" fill="#626c65" font-weight="400" >阅读摘录</text><text x="207" y="311" font-size="13" fill="#626c65" font-weight="400" >周末计划</text><rect x="343" y="144" width="920" height="538" rx="0" fill="#fffdf9" stroke="none" /><g transform="translate(380,188) scale(1)"><rect x="0" y="0" width="680" height="420" rx="0" fill="#fffdf9" stroke="none" /><text x="36" y="34" font-size="12" fill="#94897e" font-weight="400" >工作手记  /  本周</text><text x="36" y="84" font-size="28" fill="#34352f" font-weight="600" >把想法，留在眼前。</text><text x="36" y="124" font-size="17" fill="#565a53" font-weight="400" >把重要的决定留下来，</text><text x="36" y="153" font-size="17" fill="#565a53" font-weight="400" >然后继续做手头的事。</text><line x1="36" y1="179" x2="642" y2="179" stroke="#e9e4dc" stroke-width="1" /><text x="36" y="216" font-size="15" fill="#3e4740" font-weight="600" >这一周，做好三件事</text><rect x="36" y="238" width="14" height="14" rx="3" fill="#fffdf9" stroke="#b3b8ac" /><text x="62" y="251" font-size="15" fill="#565d55" font-weight="400" >把讨论里的结论整理成一页。</text><rect x="36" y="279" width="14" height="14" rx="3" fill="#fffdf9" stroke="#b3b8ac" /><text x="62" y="292" font-size="15" fill="#565d55" font-weight="400" >把关键步骤截图，标出需要改的地方。</text><rect x="36" y="320" width="14" height="14" rx="3" fill="#fffdf9" stroke="#b3b8ac" /><text x="62" y="333" font-size="15" fill="#565d55" font-weight="400" >留出一个下午，完成最想做的小项目。</text><text x="36" y="391" font-size="13" fill="#94988d" font-weight="400" >周末去走走。让脑袋也透一口气。</text><g transform="translate(476,48)"><rect width="166" height="105" rx="10" fill="#ede7d9"/><circle cx="125" cy="28" r="14" fill="#d3a370"/><path d="M0 76Q44 27 93 73T166 68V105H0Z" fill="#a4b7a2"/><path d="M0 105Q68 46 166 94V105Z" fill="url(#settings-hill)"/></g></g><rect x="0" y="32" width="1440" height="868" rx="0" fill="#e9eee7bd" stroke="none" /><rect x="420" y="282" width="600" height="314" rx="16" fill="#fafbf8" stroke="#cbd1c9" filter="url(#settings-shadow)"/><circle cx="444" cy="306" r="5.7" fill="#ff6058" stroke="#00000012" /><circle cx="464" cy="306" r="5.7" fill="#febd2e" stroke="#00000012" /><circle cx="484" cy="306" r="5.7" fill="#29c840" stroke="#00000012" /><text x="452" y="362" font-size="26" fill="#282d2a" font-weight="600" >设置</text><text x="452" y="420" font-size="16" fill="#282d2a" font-weight="400" >截图快捷键</text><g role="button" aria-label="录入截图快捷键；部分键盘需要 Fn + F1" data-action="hotkey" data-setting="hotkey" tabindex="0"><title>录入截图快捷键；部分键盘需要 Fn + F1</title><rect x="812" y="392" width="174" height="40" rx="8" fill="#fff" stroke="#d4dbd0" /><text x="899" y="418" font-size="15" fill="#282d2a" font-weight="500" text-anchor="middle">F1</text></g><line x1="452" y1="447" x2="988" y2="447" stroke="#dce1d8" stroke-width="1" /><text x="452" y="491" font-size="16" fill="#282d2a" font-weight="400" >保存位置</text><g role="button" aria-label="更改保存位置" data-action="folder" tabindex="0"><title>更改保存位置</title><rect x="812" y="463" width="174" height="40" rx="8" fill="#fff" stroke="#d4dbd0" /><g transform="translate(827,473) scale(0.8333333333333334)" fill="none" stroke="#626c65" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V4h7l2 3h9v13H3z"/></g><text x="860" y="489" font-size="15" fill="#282d2a" font-weight="400" data-folder-label="true">桌面</text><g transform="translate(956,476) scale(0.625)" fill="none" stroke="#626c65" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 10l5 5 5-5"/></g></g></svg>