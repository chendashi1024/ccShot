<script>
(()=>{
const root=document.getElementById('ccshort-design'),stage=root.querySelector('.desktop'),svg=root.querySelector('.drawing'),note=root.querySelector('.note'),entry=root.querySelector('.text-entry'),context=root.querySelector('.context-actions'),appmenu=root.querySelector('.appmenu'),shade=root.querySelector('.sheet-shade'),finish=root.querySelector('[data-finish]'),jump=root.querySelector('[data-jump]');
const ns='http://www.w3.org/2000/svg';
const names={capture:'框选',arrow:'箭头',rect:'画框',label:'文字',pen:'画笔',mask:'遮挡',highlight:'高亮',number:'序号',select:'选字'};
const hints={capture:'框选：拖动四边的控制点调整范围。',arrow:'箭头：固定绿色和圆润线条，选中即画，没有二级菜单。',rect:'画框：固定圆角和线宽，直接拖出框。',label:'文字：直接输入内容，回车确认；不显示字体、字号和颜色面板。',pen:'画笔：固定绿色圆头笔，按住鼠标连续画。',mask:'遮挡：拖出实色遮挡区域，无需选择强度。',highlight:'高亮：拖出浅绿区域，不改变下方内容。',number:'序号：单击放置，数字自动递增。',select:'选字：在图中文字上拖选；右键可复制、全选，⌘C 复制后继续编辑。'};
let tool='capture',marks=[],history=[],redo=[],sample=true,draft=null,drag=null,selected='',textPoint={x:420,y:218},timer,recording=false,lastFocus=null;
function el(tag,attrs={}){const e=document.createElementNS(ns,tag);Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k,String(v)));return e;}
function segment(m){const dx=m.b.x-m.a.x,dy=m.b.y-m.a.y,l=Math.hypot(dx,dy),u=l?dx/l:1,v=l?dy/l:0,h=Math.min(20,l*.36),w=h*.6;return `M${m.a.x} ${m.a.y} L${m.b.x-u*2} ${m.b.y-v*2} M${m.b.x-u*h-v*w} ${m.b.y-v*h+u*w} L${m.b.x} ${m.b.y} L${m.b.x-u*h+v*w} ${m.b.y-v*h-u*w}`;}
function draw(m){const color='light-dark(#35765a,#a3cfac)',common={fill:'none',stroke:color,'stroke-width':4,'stroke-linecap':'round','stroke-linejoin':'round'};let e;
 if(m.kind==='arrow')e=el('path',{...common,d:segment(m),'stroke-width':5});
 if(['rect','mask','highlight'].includes(m.kind)){const x=Math.min(m.a.x,m.b.x),y=Math.min(m.a.y,m.b.y),w=Math.abs(m.a.x-m.b.x),h=Math.abs(m.a.y-m.b.y);e=el('rect',{x,y,width:w,height:h,rx:Math.min(13,w/2,h/2),...(m.kind==='rect'?common:{fill:m.kind==='mask'?'#303d34':'#9bc689',opacity:m.kind==='highlight'?.38:1})});}
 if(m.kind==='pen')e=el('path',{...common,d:m.points.map((p,i)=>(i?'L':'M')+p.x+' '+p.y).join(' ')});
 if(m.kind==='number'){e=el('g');e.append(el('circle',{cx:m.a.x,cy:m.a.y,r:14,fill:'#35765a'}));const t=el('text',{x:m.a.x,y:m.a.y+5,'text-anchor':'middle','font-size':15,fill:'white','font-family':'-apple-system,sans-serif','font-weight':600});t.textContent=m.number;e.append(t);}
 if(m.kind==='label'){e=el('text',{x:m.a.x,y:m.a.y,fill:color,'font-size':20,'font-family':'-apple-system,PingFang SC,sans-serif','font-weight':500});e.textContent=m.text;}
 return e;
}
function paint(){svg.replaceChildren();[...marks,...(draft?[draft]:[])].forEach(m=>{const e=draw(m);if(e)svg.append(e);});root.querySelector('[data-action="undo"]').disabled=!marks.length&&!history.length;}
function snapshot(){history.push(structuredClone(marks));redo=[];}
function append(m){if(sample){marks=[];sample=false;}snapshot();marks.push(m);paint();}
function toast(s){clearTimeout(timer);root.querySelector('.demo-toast').textContent=s;timer=setTimeout(()=>root.querySelector('.demo-toast').textContent='',2600);}
function setHint(s){root.querySelector('.review-note').textContent=s;}
function commitText(){if(entry.hidden)return;const value=entry.value.trim();entry.hidden=true;if(value)append({kind:'label',a:{...textPoint},text:value});}
function openText(p){commitText();textPoint=p;entry.value='这里补一张图';entry.style.left=Math.min(p.x/670*100,61)+'%';entry.style.top=Math.min(p.y/360*100,80)+'%';entry.hidden=false;entry.focus();entry.select();}
function syncFinish(){const detail=selected?'复制所选文字并结束':'复制图片并结束';finish.dataset.tooltip=detail+' · 回车';finish.setAttribute('aria-label','完成：'+detail);}
function clearSelection(){selected='';getSelection()?.removeAllRanges();stage.dataset.state='capture';stage.dataset.all='false';syncFinish();}
function selectAll(){const range=document.createRange();range.selectNodeContents(note);const sel=getSelection();sel.removeAllRanges();sel.addRange(range);selected=note.innerText.trim();syncFinish();context.hidden=true;}
function demo(kind){const a={x:440,y:219},b={x:391,y:290};if(kind==='arrow')return[{kind,a:{x:546,y:230},b}];if(kind==='rect'||kind==='mask'||kind==='highlight')return[{kind,a:{x:53,y:274},b:{x:382,y:305}}];if(kind==='pen')return[{kind,points:[{x:62,y:302},{x:90,y:308},{x:120,y:301},{x:151,y:307},{x:185,y:302},{x:218,y:307},{x:253,y:300},{x:285,y:305},{x:327,y:300}]}];if(kind==='number')return[{kind,a:{x:19,y:257},number:1},{kind,a:{x:19,y:289},number:2},{kind,a:{x:19,y:322},number:3}];return[];}
function normal(){clearTimeout(timer);root.querySelector('.demo-toast').textContent='';stage.dataset.mode='edit';root.querySelector('.pinbar').hidden=true;root.querySelector('.result').hidden=true;shade.hidden=true;appmenu.hidden=true;context.hidden=true;}
function choose(name){commitText();normal();tool=name;stage.dataset.tool=tool;clearSelection();jump.value=tool;root.querySelectorAll('[data-tool]').forEach(b=>{const on=b.dataset.tool===tool;b.classList.toggle('active',on);b.setAttribute('aria-pressed',String(on));});if(sample){marks=demo(tool);history=[];redo=[];}paint();setHint(hints[tool]);if(tool==='label')openText({x:407,y:218});if(tool==='select'){const range=document.createRange();range.selectNodeContents(root.querySelector('.intro'));const sel=getSelection();sel.removeAllRanges();sel.addRange(range);selected=root.querySelector('.intro').innerText.trim();syncFinish();}}
function showSheet(which){clearTimeout(timer);root.querySelector('.demo-toast').textContent='';commitText();context.hidden=true;appmenu.hidden=true;lastFocus=document.activeElement;shade.hidden=false;root.querySelector('[data-save-form]').hidden=which!=='save';root.querySelector('[data-settings-panel]').hidden=which!=='settings';root.querySelector('.sheet').setAttribute('aria-label',which==='save'?'保存图片':'设置');jump.value=which;setHint(which==='save'?'保存：默认 PNG，只保留名称和位置。此处演示保存窗口，不写入文件。':'设置：仅保留截图快捷键和默认保存位置。此处修改只作用于预览。');requestAnimationFrame(()=>shade.querySelector(which==='save'?'input':'button').focus());}
function closeSheet(){shade.hidden=true;recording=false;root.querySelector('[data-shortcut]').textContent=root.dataset.shortcut||'⌃⌥S';lastFocus?.focus();}
function pin(){commitText();normal();clearSelection();stage.dataset.mode='pin';root.querySelector('.pinbar').hidden=false;jump.value='pin';setHint('钉图：图片独立悬浮，只保留编辑、保存和关闭。');}
function complete(cancel=false){commitText();context.hidden=true;appmenu.hidden=true;shade.hidden=true;stage.dataset.mode='done';root.querySelector('.pinbar').hidden=true;const result=root.querySelector('.result');result.hidden=false;result.querySelector('h3').textContent=cancel?'已取消':'已完成';root.querySelector('[data-result]').textContent=cancel?'本次截图已收起':selected?'已复制所选文字':'已复制图片';const quote=result.querySelector('blockquote');quote.hidden=cancel||!selected;quote.textContent=selected;jump.value='done';setHint(cancel?'结束状态演示：取消不复制。':'完成状态演示：只复制当前目标，然后结束；预览不写入系统剪贴板。');}
function copy(){toast('演示：已复制'+(selected?'所选文字':'图片')+'，继续编辑');context.hidden=true;}
function reset(){root.querySelector('.composition').style.width='';note.style.minHeight='';root.querySelector('.dimensions span').textContent='1340 × 716';entry.hidden=true;marks=[];history=[];redo=[];sample=true;normal();choose('capture');}
root.querySelectorAll('[data-tool]').forEach(b=>b.addEventListener('click',()=>choose(b.dataset.tool)));
root.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>{const a=b.dataset.action;if(a==='undo'){commitText();if(history.length){redo.push(marks);marks=history.pop();}else{redo.push(marks);marks=[];sample=false;}paint();}if(a==='pin')pin();if(a==='save'||a==='settings')showSheet(a);if(a==='edit')choose('capture');if(a==='close'||a==='quit')complete(true);}));
finish.addEventListener('click',()=>complete());root.querySelector('[data-new]').addEventListener('click',reset);root.querySelector('[data-reset]').addEventListener('click',reset);
root.querySelector('[data-dark]').addEventListener('change',e=>stage.style.colorScheme=e.target.checked?'dark':'light');
root.querySelector('[data-appmenu]').addEventListener('click',()=>{appmenu.hidden=!appmenu.hidden;context.hidden=true;jump.value='appmenu';setHint('菜单栏：三个截图入口、设置和退出；不增加账户、AI 或高级配置。');});
root.querySelectorAll('[data-capture]').forEach(b=>b.addEventListener('click',()=>{reset();toast('演示：'+b.dataset.capture+'，使用当前样例');}));
jump.addEventListener('change',()=>{const v=jump.value;if(names[v]){entry.hidden=true;marks=[];history=[];redo=[];sample=true;choose(v);}else if(v==='pin')pin();else if(v==='done')complete();else if(v==='appmenu')root.querySelector('[data-appmenu]').click();else showSheet(v);});
root.querySelectorAll('[data-cancel]').forEach(b=>b.addEventListener('click',closeSheet));
function savePreview(){const form=root.querySelector('[data-save-form]');if(!form.reportValidity())return;const data=new FormData(form);let name=String(data.get('filename')).trim();if(!name){form.elements.filename.focus();return;}if(!name.toLowerCase().endsWith('.png'))name+='.png';const folder=String(data.get('folder'));closeSheet();toast('演示：保存到'+folder+' / '+name);}
root.querySelector('[data-save-confirm]').addEventListener('click',savePreview);
root.querySelector('[data-save-form]').addEventListener('submit',e=>{e.preventDefault();savePreview();});
root.querySelector('[data-save-form]').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();e.stopPropagation();savePreview();}});
root.querySelector('#ccshort-folder').addEventListener('change',e=>root.querySelector('[name="folder"]').value=e.target.value);
root.querySelector('[data-shortcut]').addEventListener('click',e=>{recording=true;e.target.textContent='请按快捷键';});
function point(e){const r=svg.getBoundingClientRect();return{x:Math.max(0,Math.min(670,(e.clientX-r.left)/r.width*670)),y:Math.max(0,Math.min(360,(e.clientY-r.top)/r.height*360))};}
svg.addEventListener('pointerdown',e=>{if(stage.dataset.mode==='pin'||!shade.hidden)return;if(!names[tool]||['select','capture'].includes(tool))return;e.preventDefault();context.hidden=true;const p=point(e);if(tool==='label'){openText(p);return;}if(tool==='number'){append({kind:'number',a:p,number:sample?1:marks.filter(m=>m.kind==='number').length+1});return;}svg.setPointerCapture(e.pointerId);drag=p;draft=tool==='pen'?{kind:tool,points:[p]}:{kind:tool,a:p,b:p};if(sample){marks=[];sample=false;}paint();});
svg.addEventListener('pointermove',e=>{if(!drag||!draft)return;const p=point(e);if(tool==='pen')draft.points.push(p);else draft.b=p;paint();});
svg.addEventListener('pointerup',()=>{if(!drag||!draft)return;const m=draft;draft=null;drag=null;if(m.kind==='pen'?m.points.length>1:Math.hypot(m.b.x-m.a.x,m.b.y-m.a.y)>4)append(m);else paint();});
svg.addEventListener('pointercancel',()=>{draft=null;drag=null;paint();});
entry.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();e.stopPropagation();commitText();}if(e.key==='Escape'){e.stopPropagation();entry.hidden=true;}});
let resize=null;
root.querySelectorAll('.handle').forEach(h=>{h.style.pointerEvents='auto';h.addEventListener('pointerdown',e=>{if(tool!=='capture')return;e.preventDefault();h.setPointerCapture(e.pointerId);resize={x:e.clientX,y:e.clientY,width:root.querySelector('.composition').offsetWidth,height:note.offsetHeight,h};});h.addEventListener('pointermove',e=>{if(!resize||resize.h!==h)return;const side=h.classList.contains('w')?-1:1;if(h.classList.contains('e')||h.classList.contains('w'))root.querySelector('.composition').style.width=Math.max(440,Math.min(stage.clientWidth-50,resize.width+side*(e.clientX-resize.x)))+'px';else note.style.minHeight=Math.max(358,Math.min(390,resize.height+(h.classList.contains('n')?-1:1)*(e.clientY-resize.y)))+'px';root.querySelector('.dimensions span').textContent=Math.round(note.offsetWidth*2)+' × '+Math.round(note.offsetHeight*2);});h.addEventListener('pointerup',()=>resize=null);h.addEventListener('pointercancel',()=>resize=null);});
function selectionChanged(){if(tool!=='select')return;const sel=getSelection();if(sel&&note.contains(sel.anchorNode)&&note.contains(sel.focusNode)){selected=sel.toString().trim();syncFinish();}}
document.addEventListener('selectionchange',selectionChanged);
root.querySelector('[data-copy]').addEventListener('click',copy);root.querySelector('[data-select-all]').addEventListener('click',selectAll);
note.addEventListener('contextmenu',e=>{if(tool!=='select')return;e.preventDefault();const r=stage.getBoundingClientRect();context.hidden=false;context.style.left=Math.max(8,Math.min(e.clientX-r.left,r.width-context.offsetWidth-8))+'px';context.style.top=Math.max(8,Math.min(e.clientY-r.top,r.height-context.offsetHeight-8))+'px';context.querySelector('button').focus();setHint('右键菜单只保留复制和全选，不常驻遮挡文字。');});
root.addEventListener('click',e=>{if(!context.contains(e.target))context.hidden=true;if(!appmenu.contains(e.target)&&!e.target.closest('[data-appmenu]'))appmenu.hidden=true;});
root.addEventListener('keydown',e=>{if(recording){e.preventDefault();if(e.key==='Escape'){recording=false;root.querySelector('[data-shortcut]').textContent=root.dataset.shortcut||'⌃⌥S';return;}if(['Meta','Control','Alt','Shift'].includes(e.key))return;if(!(e.metaKey||e.ctrlKey||e.altKey)){toast('请组合 Command、Control 或 Option 键');return;}root.dataset.shortcut=(e.ctrlKey?'⌃':'')+(e.altKey?'⌥':'')+(e.metaKey?'⌘':'')+(e.shiftKey?'⇧':'')+e.key.toUpperCase();root.querySelector('[data-shortcut]').textContent=root.dataset.shortcut;recording=false;return;}if(e.target.matches('input,select,textarea'))return;if(e.key==='Escape'){if(!shade.hidden)closeSheet();else if(!context.hidden)context.hidden=true;else if(!appmenu.hidden)appmenu.hidden=true;else if(tool!=='capture')choose('capture');else complete(true);return;}if(!shade.hidden||stage.dataset.mode==='done')return;if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='c'){e.preventDefault();copy();}if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='a'&&tool==='select'){e.preventDefault();selectAll();}if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='z'){e.preventDefault();if(e.shiftKey&&redo.length){history.push(marks);marks=redo.pop();paint();}else root.querySelector('[data-action="undo"]').click();}if(e.key==='Enter'&&e.target.tagName!=='BUTTON'){e.preventDefault();complete();}});
reset();
})();
</script>
