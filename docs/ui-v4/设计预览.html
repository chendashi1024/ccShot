<style>
#ccshort-design {font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;}
#ccshort-design .review-controls {display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:16px;padding-right:100px}
#ccshort-design .review-controls .design-label {margin-left:auto;font-size:12px;color:light-dark(#647168,#b0bcb4)}
#ccshort-design .desktop {--leaf:#35765A;--soft:#E1EEDF;--ink:light-dark(#29382f,#e7ede7);--sub:light-dark(#718076,#a0b0a4);--surface:light-dark(#fafcf8,#25352d);--hair:light-dark(#e2e8de,#425247);position:relative;overflow:hidden;isolation:isolate;min-height:690px;border-radius:20px;background:light-dark(#dbe5d4,#172a22);color:var(--ink);font-size:14px;line-height:1.5}
#ccshort-design .wallpaper {position:absolute;inset:0;z-index:-1;background:radial-gradient(ellipse at 8% 92%,light-dark(#aec4a7,#254b38),transparent 58%),radial-gradient(ellipse at 88% 18%,light-dark(#f0f2dc,#345541),transparent 60%)}
#ccshort-design .wallpaper:after {content:"";position:absolute;width:850px;height:400px;top:310px;left:22%;border-radius:50%;background:light-dark(#c1d2b5,#284e38);transform:rotate(-24deg);opacity:.42}
#ccshort-design .menubar {height:34px;padding:0 22px;display:flex;align-items:center;gap:22px;background:light-dark(#edf2e7b8,#1b2d24ba);font-size:12px}
#ccshort-design .brand {font-weight:650;display:flex;align-items:center;gap:7px}
#ccshort-design .menubar .time {margin-left:auto}
#ccshort-design .back-window {position:absolute;left:7%;right:7%;top:65px;height:450px;border-radius:23px;background:light-dark(#f8faf3,#29392e);box-shadow:0 24px 65px #13291f16;overflow:hidden}
#ccshort-design .window-top {height:40px;display:flex;gap:7px;align-items:center;padding:0 18px;border-bottom:1px solid var(--hair);font-size:12px;color:var(--sub)}
#ccshort-design .traffic {width:9px;height:9px;border-radius:50%;background:#ed8d82}
#ccshort-design .traffic:nth-child(2) {background:#e4c66f}
#ccshort-design .traffic:nth-child(3) {background:#8ebb86}
#ccshort-design .window-top span:last-child {margin:auto}
#ccshort-design .underlay-text {position:absolute;left:28px;top:75px;display:grid;gap:20px;color:var(--sub);font-size:12px}
#ccshort-design .veil {position:absolute;inset:34px 0 0;background:light-dark(#203c2c22,#08180d49);pointer-events:none}
#ccshort-design .composition {position:relative;width:min(670px,calc(100% - 120px));margin:79px auto 0}
#ccshort-design .dimensions {position:absolute;left:16px;top:-36px;display:flex;align-items:center;gap:8px;padding:5px 12px;border-radius:12px;background:light-dark(#fbfdf7,#2a3b30);box-shadow:0 3px 12px #162c1810;font-size:11px;font-variant-numeric:tabular-nums;color:var(--sub)}
#ccshort-design .note {position:relative;border-radius:var(--radius,30px);background:light-dark(#fffef9,#202e27);min-height:358px;padding:28px 34px;box-shadow:0 0 0 2px light-dark(#80a88c,#9cc3a3),0 14px 36px #143c271a;box-sizing:border-box}
#ccshort-design .note .eyebrow {font-size:12px;color:var(--sub);margin:0 0 12px}
#ccshort-design .note h2 {font-size:29px;line-height:1.35;letter-spacing:-.8px;font-weight:600;margin:0 0 13px;color:var(--ink)}
#ccshort-design .intro {font-size:16px;line-height:1.85;margin:0;color:var(--sub);position:relative;z-index:2}
#ccshort-design .intro .selectable {border-radius:4px;padding:2px 0;box-decoration-break:clone;-webkit-box-decoration-break:clone}
#ccshort-design [data-state="text"] .intro .selectable {background:light-dark(#cee4c8,#42694b);color:light-dark(#254e35,#edf5e8)}
#ccshort-design .note hr {border:0;border-top:1px solid var(--hair);margin:24px 0 18px}
#ccshort-design .task-heading {font-weight:550;font-size:14px;margin:0 0 12px}
#ccshort-design .tasks {display:grid;gap:12px;font-size:14px;color:var(--sub)}
#ccshort-design .task {display:flex;align-items:center;gap:12px}
#ccshort-design .checkbox {width:14px;height:14px;border:1.4px solid light-dark(#bac6b6,#69806c);border-radius:5px;flex:none}
#ccshort-design .landscape {position:absolute;right:34px;top:33px;width:155px;height:105px;border-radius:23px;overflow:hidden;background:light-dark(#e9ebd9,#455440)}
#ccshort-design .sun {position:absolute;right:22px;top:16px;width:22px;height:22px;border-radius:50%;background:#d5b67e}
#ccshort-design .hill {position:absolute;width:160px;height:85px;border-radius:55% 75% 0 0;left:-28px;top:49px;background:#b1c3a2;transform:rotate(-16deg)}
#ccshort-design .hill.front {left:44px;top:68px;background:#5f8669;transform:rotate(12deg)}
#ccshort-design .art-caption {position:absolute;right:34px;top:148px;font-size:10px;letter-spacing:1px;color:var(--sub)}
#ccshort-design .handle {position:absolute;width:10px;height:10px;border-radius:4px;background:light-dark(#f9fdf6,#e5f0df);box-shadow:0 0 0 1.5px #6c9477;pointer-events:none}
#ccshort-design .handle.n {top:-5px;left:calc(50% - 5px)}
#ccshort-design .handle.s {bottom:-5px;left:calc(50% - 5px)}
#ccshort-design .handle.w {left:-5px;top:calc(50% - 5px)}
#ccshort-design .handle.e {right:-5px;top:calc(50% - 5px)}
#ccshort-design .crop-cursor {position:absolute;right:-20px;bottom:-19px;color:light-dark(#234c32,#e8f2e3);filter:drop-shadow(0 1px 1px white)}
#ccshort-design .crop-cursor svg {width:27px;height:27px}
#ccshort-design .marking {position:absolute;inset:0;width:100%;height:100%;pointer-events:none;display:none;overflow:visible}
#ccshort-design [data-state="annotation"] .marking {display:block}
#ccshort-design .annotation-label {display:none;position:absolute;right:49px;top:203px;color:light-dark(var(--leaf),#a3cfac);font-size:16px;font-weight:600;transform:rotate(-4deg)}
#ccshort-design [data-state="annotation"] .annotation-label {display:block}
#ccshort-design .toolbar {position:relative;display:flex;align-items:center;gap:4px;padding:9px 10px;width:max-content;max-width:calc(100% - 48px);margin:27px auto 0;border-radius:23px;background:var(--surface);box-shadow:0 15px 35px #17312422,inset 0 1px 0 light-dark(#ffffff,#4a5e4f);box-sizing:border-box}
#ccshort-design .tool {appearance:none;border:none;color:var(--ink);background:transparent;width:38px;height:38px;border-radius:13px;display:inline-flex;align-items:center;justify-content:center;padding:0;flex:none;font:inherit;transition:background .15s}
#ccshort-design .tool:hover {background:light-dark(#eef2e9,#344b3b)}
#ccshort-design .tool.active {background:light-dark(#dfedd9,#426047);color:light-dark(#397549,#dbecd5)}
#ccshort-design .tool svg {width:20px;height:20px;stroke-width:1.8}
#ccshort-design .divider {height:22px;width:1px;background:var(--hair);margin:0 5px;flex:none}
#ccshort-design .copy {border:none;background:var(--leaf);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:14px;height:40px;padding:0 14px;font:500 13px inherit;min-width:108px;white-space:nowrap}
#ccshort-design .copy svg {width:16px;height:16px}
#ccshort-design .selection-actions {display:none;align-items:center;gap:2px;padding:5px;position:absolute;top:177px;left:35px;border-radius:15px;background:var(--surface);box-shadow:0 6px 25px #17312428;z-index:4}
#ccshort-design .selection-actions button {border:0;background:transparent;border-radius:10px;padding:6px 10px;font-family:inherit;font-size:12px;color:var(--ink)}
#ccshort-design .selection-actions button:hover {background:var(--soft);color:#294e35}
#ccshort-design [data-state="text"] .selection-actions {display:flex}
#ccshort-design .stylebar {display:none;align-items:center;gap:12px;margin:13px auto 0;padding:8px 14px;border-radius:18px;background:var(--surface);width:max-content;max-width:90%;box-shadow:0 6px 20px #183c2414;font-size:12px;color:var(--sub)}
#ccshort-design [data-state="annotation"] .stylebar {display:flex}
#ccshort-design .swatch {width:18px;height:18px;border:0;border-radius:50%;padding:0}
#ccshort-design .swatch.selected {outline:1.5px solid var(--leaf);outline-offset:3px}
#ccshort-design .line-weight {width:28px;height:4px;border-radius:3px;background:var(--ink)}
#ccshort-design .state-caption {position:absolute;bottom:22px;left:20px;right:20px;text-align:center;color:light-dark(#4c6551,#b4c7b7);font-size:12px}
#ccshort-design .state-caption kbd {font:inherit;background:light-dark(#e5eddf,#304637);padding:3px 6px;border-radius:5px;margin-right:3px}
#ccshort-design [data-state="annotation"] .crop-cursor,#ccshort-design [data-state="text"] .crop-cursor {display:none}
#ccshort-design [data-state="text"] .handle {opacity:.55}
#ccshort-design .demo-toast {position:absolute;bottom:50px;left:50%;transform:translateX(-50%);padding:8px 15px;border-radius:12px;background:var(--surface);font-size:12px;box-shadow:0 5px 20px #17312422;white-space:nowrap}
#ccshort-design .demo-toast:empty {display:none}
@media(max-width:760px) {#ccshort-design .composition {width:calc(100% - 60px)}#ccshort-design .toolbar{gap:1px;padding:8px}#ccshort-design .tool{width:32px}#ccshort-design .toolbar .optional {display:none}#ccshort-design .landscape{width:118px;right:25px}#ccshort-design .note h2{font-size:25px}#ccshort-design .art-caption{right:25px}#ccshort-design .annotation-label{right:28px}#ccshort-design .note{padding:28px}}
@media(max-width:530px) {#ccshort-design .desktop{min-height:675px}#ccshort-design .menubar{gap:12px;padding:0 14px}#ccshort-design .menubar .menu-extra{display:none}#ccshort-design .composition{width:calc(100% - 34px);margin-top:65px}#ccshort-design .note{padding:25px 22px;min-height:376px}#ccshort-design .note h2{font-size:23px;letter-spacing:-1px}#ccshort-design .intro{font-size:14px}#ccshort-design .landscape,#ccshort-design .art-caption{display:none}#ccshort-design .tasks{font-size:12px;gap:15px}#ccshort-design .toolbar{max-width:calc(100% - 22px);flex-wrap:wrap;justify-content:center;margin-top:21px}#ccshort-design .toolbar .secondary,#ccshort-design .toolbar .divider.secondary{display:none}#ccshort-design .copy{min-width:90px;padding:0 9px}#ccshort-design .tool{width:31px;height:35px}#ccshort-design .annotation-label{top:183px;right:22px;font-size:13px}#ccshort-design .selection-actions{left:22px;top:162px}#ccshort-design .review-controls{padding-right:0}#ccshort-design .review-controls .design-label{display:none}#ccshort-design .stylebar{gap:10px}#ccshort-design .state-caption{font-size:11px}}
@media(prefers-reduced-motion:reduce){#ccshort-design *{transition:none!important}}
</style>
<div id="ccshort-design">
  <div class="review-controls" aria-label="设计稿状态">
    <button class="btn btn-primary" data-scene="capture" aria-pressed="true">框选</button>
    <button class="btn" data-scene="annotation" aria-pressed="false">标注</button>
    <button class="btn" data-scene="text" aria-pressed="false">选字</button>
    <span class="design-label">ccShort · 设计预览</span>
  </div>
  <div class="desktop" data-state="capture" aria-label="ccShort 绿色圆角设计">
    <div class="wallpaper"></div>
    <div class="menubar"><span class="brand"><i data-lucide="scan" aria-hidden="true"></i> ccShort</span><span>文件</span><span class="menu-extra">编辑</span><span class="menu-extra">显示</span><span class="time">周日  11:08</span></div>
    <div class="back-window"><div class="window-top"><span class="traffic"></span><span class="traffic"></span><span class="traffic"></span><span>工作手记</span></div><div class="underlay-text"><span>我的笔记</span><span>本周计划</span><span>阅读摘录</span></div></div>
    <div class="veil"></div>
    <div class="composition">
      <div class="dimensions"><i data-lucide="crop" aria-hidden="true"></i><span>1340 × 716</span></div>
      <article class="note">
        <p class="eyebrow">工作手记 / 本周</p>
        <h2>把想法，留在眼前。</h2>
        <p class="intro"><span class="selectable">把重要的决定留下来，</span><br><span class="selectable">然后继续做手头的事。</span></p>
        <div class="landscape" aria-label="绿色山丘插画" role="img"><div class="sun"></div><div class="hill"></div><div class="hill front"></div></div>
        <hr>
        <p class="task-heading">这一周，做好三件事</p>
        <div class="tasks"><div class="task"><span class="checkbox"></span><span>把讨论里的结论整理成一页。</span></div><div class="task"><span class="checkbox"></span><span>把关键步骤截图，标出需要改的地方。</span></div><div class="task"><span class="checkbox"></span><span>留出一个下午，完成最想做的小项目。</span></div></div>
        <svg class="marking" viewBox="0 0 670 358" preserveAspectRatio="none" role="img" aria-label="深绿色空心箭头指向第二项任务"><path d="M548 222 C516 271 462 289 402 291 M422 273 L400 291 L423 305" fill="none" stroke="light-dark(var(--leaf),#a3cfac)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="50" y="273" width="330" height="32" rx="12" fill="none" stroke="light-dark(var(--leaf),#a3cfac)" stroke-width="2.5" opacity=".8"/></svg>
        <span class="annotation-label">这里补一张图</span>
        <span class="handle n"></span><span class="handle s"></span><span class="handle w"></span><span class="handle e"></span>
        <span class="crop-cursor"><i data-lucide="move-diagonal-2" aria-hidden="true"></i></span>
        <div class="selection-actions"><button data-demo="已演示复制选中文字">复制</button><button data-demo="已演示选取全部文字">全选</button></div>
      </article>
    </div>
    <div class="toolbar" role="toolbar" aria-label="截图工具设计">
      <button class="tool active" data-tool="capture" aria-label="选择" data-tooltip="选择与选字"><i data-lucide="mouse-pointer-2" aria-hidden="true"></i></button>
      <button class="tool" data-tool="annotation" aria-label="箭头" data-tooltip="箭头"><i data-lucide="move-up-right" aria-hidden="true"></i></button>
      <button class="tool" data-demo="圆角画框样式预览" aria-label="画框" data-tooltip="画框"><i data-lucide="square" aria-hidden="true"></i></button>
      <button class="tool" data-demo="文字标注样式预览" aria-label="文字" data-tooltip="文字"><i data-lucide="type" aria-hidden="true"></i></button>
      <button class="tool secondary" data-demo="画笔工具示意" aria-label="画笔" data-tooltip="画笔"><i data-lucide="pencil" aria-hidden="true"></i></button>
      <button class="tool secondary" data-demo="遮挡工具示意" aria-label="遮挡" data-tooltip="遮挡"><i data-lucide="grid-2x2" aria-hidden="true"></i></button>
      <button class="tool secondary" data-demo="高亮工具示意" aria-label="高亮" data-tooltip="高亮"><i data-lucide="highlighter" aria-hidden="true"></i></button>
      <button class="tool secondary" data-demo="序号工具示意" aria-label="序号" data-tooltip="序号"><i data-lucide="list-ordered" aria-hidden="true"></i></button>
      <span class="divider secondary"></span>
      <button class="tool" data-tool="text" aria-label="选择文字" data-tooltip="选择文字"><i data-lucide="scan-text" aria-hidden="true"></i></button>
      <button class="tool optional" data-demo="撤销操作示意" aria-label="撤销" data-tooltip="撤销"><i data-lucide="undo-2" aria-hidden="true"></i></button>
      <span class="divider"></span>
      <button class="tool optional" data-demo="钉图操作示意" aria-label="钉住" data-tooltip="钉住"><i data-lucide="pin" aria-hidden="true"></i></button>
      <button class="tool optional" data-demo="保存操作示意，不生成文件" aria-label="保存" data-tooltip="保存"><i data-lucide="download" aria-hidden="true"></i></button>
      <button class="copy" data-demo="复制操作示意，不改动剪贴板"><i data-lucide="copy" aria-hidden="true"></i><span>复制图片</span></button>
      <button class="tool" data-demo="结束截图操作示意" aria-label="关闭" data-tooltip="关闭"><i data-lucide="x" aria-hidden="true"></i></button>
    </div>
    <div class="stylebar" aria-label="箭头样式"><button class="swatch selected" style="background:#35765a" data-color="#35765a" aria-label="叶绿色"></button><button class="swatch" style="background:#ca715c" data-color="#ca715c" aria-label="陶红色"></button><button class="swatch" style="background:#6683ae" data-color="#6683ae" aria-label="雾蓝色"></button><button class="swatch" style="background:#343c35" data-color="#343c35" aria-label="炭灰色"></button><span class="divider"></span><span class="line-weight"></span><span>6</span><span class="divider"></span><span>空心箭头</span></div>
    <div class="demo-toast" role="status"></div>
    <div class="state-caption" aria-live="polite"><kbd>↵</kbd> 复制图片 <span style="margin:0 10px;opacity:.4">·</span> 拖选图中文字即可复制</div>
  </div>
</div>
<script>
(()=>{
const root=document.getElementById('ccshort-design');
const stage=root.querySelector('.desktop');
const state={radius:30,accent:'#35765a',appearance:'light dark'};
let toastTimer;
function render(){stage.style.colorScheme=state.appearance;stage.style.setProperty('--radius',state.radius+'px');stage.style.setProperty('--leaf',state.accent);}
function scene(name){stage.dataset.state=name;root.querySelectorAll('[data-scene]').forEach(b=>{let active=b.dataset.scene===name;b.classList.toggle('btn-primary',active);b.setAttribute('aria-pressed',String(active));});root.querySelectorAll('[data-tool]').forEach(b=>{let active=b.dataset.tool===name;b.classList.toggle('active',active);b.setAttribute('aria-pressed',String(active));});root.querySelector('.copy span').textContent=name==='text'?'复制文字':'复制图片';root.querySelector('.state-caption').innerHTML=name==='text'?'<kbd>⌘ C</kbd> 复制选中文字':name==='annotation'?'<kbd>Esc</kbd> 返回选择 <span style="margin:0 10px;opacity:.4">·</span> <kbd>↵</kbd> 复制图片':'<kbd>↵</kbd> 复制图片 <span style="margin:0 10px;opacity:.4">·</span> 拖选图中文字即可复制';root.querySelector('.demo-toast').textContent='';}
root.querySelectorAll('[data-scene],[data-tool]').forEach(b=>b.addEventListener('click',()=>scene(b.dataset.scene||b.dataset.tool)));
root.querySelectorAll('[data-demo]').forEach(b=>b.addEventListener('click',()=>{clearTimeout(toastTimer);root.querySelector('.demo-toast').textContent=b.dataset.demo;toastTimer=setTimeout(()=>root.querySelector('.demo-toast').textContent='',2200);}));
root.querySelectorAll('[data-color]').forEach(b=>b.addEventListener('click',()=>{state.accent=b.dataset.color;render();root.querySelectorAll('[data-color]').forEach(c=>c.classList.toggle('selected',c===b));}));
render();scene('capture');
if(globalThis.Tweak){const t=new Tweak({container:stage,onChange:render});t.addSelect(state,'appearance',{label:'外观',options:[{label:'跟随系统',value:'light dark'},{label:'浅色',value:'light'},{label:'深色',value:'dark'}]});t.addSlider(state,'radius',{label:'圆润程度',min:18,max:40,unit:'px'});t.addColorPicker(state,'accent',{label:'标注与按钮绿色',reference:'--leaf'});}
})();
</script>
