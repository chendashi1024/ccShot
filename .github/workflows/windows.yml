name: Windows 构建与桌面验证

on:
  push:
    branches: [workbuddy/ccshot-windows]
    paths: ['VERSION', 'windows/**', '.github/workflows/windows.yml']

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: 构建与核心测试
        shell: pwsh
        run: |
          dotnet build windows/ccShot.sln -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test windows/tests/ccShot.Core.Tests -c Release --no-build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 校验并准备本地轻量模型
        shell: pwsh
        run: |
          $lock = Get-Content windows/models/models.lock.json -Raw | ConvertFrom-Json
          foreach ($asset in $lock.assets | Where-Object { $_.path.StartsWith('models/mobile/') }) {
            $path = Join-Path windows $asset.path
            New-Item -ItemType Directory -Force (Split-Path $path) | Out-Null
            Invoke-WebRequest -Uri $asset.url -OutFile $path
            if ((Get-FileHash $path -Algorithm SHA256).Hash -ne $asset.sha256) {
              throw "模型校验失败 $($asset.path)"
            }
          }
      - name: 运行 Windows x64 同图识字
        shell: pwsh
        run: |
          dotnet run --project windows/src/ccShot.Tools -c Release --no-build -- bench --manifest windows/testdata/windows-01/manifest.json --out "$env:RUNNER_TEMP/ccShot-ocr.json" --model mobile=windows/models/mobile --repeat 1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $report = Get-Content "$env:RUNNER_TEMP/ccShot-ocr.json" -Raw | ConvertFrom-Json
          if ($report.models[0].aggregate.failures -ne 0 -or $report.models[0].aggregate.emptyOutputs -ne 0) {
            throw '至少一张固定样本识字失败'
          }
      - name: 实际唤起、截图、选字与剪贴板检查
        shell: pwsh
        run: |
          dotnet build windows/tests/ccShot.Windows.Smoke -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $output = 'windows/tests/ccShot.Windows.Smoke/bin/Release/net8.0-windows'
          New-Item -ItemType Directory -Force "$output/models" | Out-Null
          Copy-Item -Recurse windows/models/mobile "$output/models"
          $app = (Resolve-Path "$output/ccShot.Windows.Smoke.exe").Path
          $rule = New-NetFirewallRule -DisplayName 'ccShot desktop smoke block outbound' -Program $app -Direction Outbound -Action Block -Profile Any
          try {
            Get-NetFirewallProfile -PolicyStore ActiveStore | Select-Object Name, Enabled | Format-Table
            & $app windows/testdata/windows-01/01-en.png
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Remove-NetFirewallRule -Name $rule.Name
          }
      - name: 生成 Windows 下载包
        shell: bash
        env:
          PYTHON: python
        run: bash windows/tools/package.sh
      - name: 校验 Windows 下载包并启动
        shell: pwsh
        run: |
          $revision = git rev-parse --short HEAD
          $packages = "windows/dist/packages/$revision"
          $version = (Get-Content VERSION -Raw).Trim()
          $name = "ccShot-$version-windows-x64"
          $archives = @(Get-ChildItem -LiteralPath $packages -File -Filter '*.zip')
          if ($archives.Count -ne 1 -or $archives[0].Name -cne "$name.zip") {
            throw "应只生成 $name.zip"
          }
          $zip = $archives[0]
          $hash = (Get-FileHash -LiteralPath $zip.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $sums = @(Get-Content -LiteralPath "$packages/SHA256SUMS.txt")
          if ($sums.Count -ne 1 -or $sums[0] -cne "$hash  $name.zip") {
            throw 'ZIP 校验值与清单不一致'
          }
          $output = Join-Path $env:RUNNER_TEMP 'ccShot-portable'
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath $output
          $appDir = Join-Path $output $name
          $runtime = 'coreclr.dll', 'PresentationFramework.dll', 'onnxruntime.dll',
            'msvcp140.dll', 'msvcp140_1.dll', 'vcruntime140.dll', 'vcruntime140_1.dll'
          foreach ($dll in $runtime) {
            if (-not (Test-Path -LiteralPath "$appDir/$dll" -PathType Leaf)) { throw "下载包缺少 $dll" }
          }
          $app = Get-ChildItem -LiteralPath $appDir -File | Where-Object Name -CEQ 'ccShot.exe'
          if (-not $app -or $app.VersionInfo.ProductName -cne 'ccShot') {
            throw '程序文件名和产品名称应写作 ccShot'
          }
          $appVersion = $app.VersionInfo.ProductVersion
          if ($appVersion -cne $version) { throw "程序版本 $appVersion 与 VERSION 中的 $version 不一致" }
          $process = Start-Process $app.FullName -PassThru
          try {
            Start-Sleep -Seconds 2
            $process.Refresh()
            if ($process.HasExited) { throw "ccShot 启动后退出（$($process.ExitCode)）" }
            Write-Host "ccShot $appVersion 已从下载包启动并保持运行"
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id }
          }
