name: macOS 构建与核心检查

on:
  pull_request:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: 构建并运行核心检查
        run: bash app/check.sh --core-only
      - name: 生成并校验 macOS 下载包
        if: github.ref == 'refs/heads/main'
        run: bash app/package-release.sh
      - name: 保存 macOS 下载包与校验文件
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: ccshot-macos-arm64
          path: app/build/releases/${{ github.sha }}/**/*.dmg*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
